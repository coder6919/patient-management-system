spring.application.name=analytics-service


# Force the consumer to go back and read the 3 existing messages
spring.kafka.consumer.auto-offset-reset=earliest

# Ensure this matches your Kafka service name in Docker
spring.kafka.bootstrap-servers=kafka:9092

# Explicitly set the group ID
spring.kafka.consumer.group-id=analytics-service
# Fixes potential hang in Spring Boot 4
spring.kafka.listener.type=single
# Ensures the consumer doesn't get stuck waiting for a heartbeat
spring.kafka.consumer.heartbeat-interval=3000

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.ByteArrayDeserializer